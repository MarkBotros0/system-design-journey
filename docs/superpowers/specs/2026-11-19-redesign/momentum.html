<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Throughput Momentum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
[data-theme="dark"]{
  --paper:#0A0C11; --surface:#141720; --surface-2:#1B1F2A; --surface-3:#272C39;
  --hairline:rgba(255,255,255,.07);
  --ink:#F3F4F8; --ink-2:#BAC0CE; --ink-3:#8F96A9; --on-ink:#0A0C11;
  --correct:#3DDC8E; --wrong:#FF6672; --streak:#FF9F45; --mastered:#FFCF5C;
  --tint:17%;
  --t-found:#6CB4FF; --t-prin:#A493FF; --t-pat:#D08CFF; --t-lld:#F58AE0;
  --t-core:#3FD2E6; --t-db:#3DDBB8; --t-dist:#8C9EFF; --t-arch:#C9E25B;
  --t-prod:#FF8FB0; --t-appl:#A6E36B; --t-int:#E9EBF2;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset;
  --bar:rgba(27,31,42,.82);
}
[data-theme="light"]{
  --paper:#F4F5F8; --surface:#FFFFFF; --surface-2:#FFFFFF; --surface-3:#E6E9F0;
  --hairline:rgba(15,20,35,.08);
  --ink:#12141B; --ink-2:#464C5F; --ink-3:#646A80; --on-ink:#FFFFFF;
  --correct:#0B8A52; --wrong:#CF2E3C; --streak:#BF5A00; --mastered:#946A00;
  --tint:12%;
  --t-found:#1E6CCB; --t-prin:#6247DB; --t-pat:#8E2FD2; --t-lld:#B42C96;
  --t-core:#087C90; --t-db:#0A7A64; --t-dist:#3F55D6; --t-arch:#66750C;
  --t-prod:#C02A60; --t-appl:#3C7B12; --t-int:#14161C;
  --shadow:0 1px 2px rgba(16,20,40,.05),0 8px 24px -12px rgba(16,20,40,.12);
  --bar:rgba(255,255,255,.86);
}
.tr-found{--t:var(--t-found)} .tr-prin{--t:var(--t-prin)} .tr-pat{--t:var(--t-pat)}
.tr-lld{--t:var(--t-lld)} .tr-core{--t:var(--t-core)} .tr-db{--t:var(--t-db)}
.tr-dist{--t:var(--t-dist)} .tr-arch{--t:var(--t-arch)} .tr-prod{--t:var(--t-prod)}
.tr-appl{--t:var(--t-appl)} .tr-int{--t:var(--t-int)}

/* ---------- presentation page ---------- */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#2B2E36;font-family:"Plus Jakarta Sans",system-ui,sans-serif;padding:40px;color:#DADCE3}
.board{display:flex;flex-wrap:wrap;gap:40px}
.shot figcaption{font:600 14px/1 "Plus Jakarta Sans";color:#C9CCD6;margin:0 0 12px 4px;letter-spacing:.01em}
.phone{width:390px;height:844px;overflow:hidden;position:relative;background:var(--paper);color:var(--ink);border-radius:44px;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:18px;height:18px} svg.xs{width:15px;height:15px;stroke-width:2.4}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in oklab,var(--ink) 14%,transparent)}}

/* status bar + home indicator */
.sb{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 36px;font-weight:700;font-size:16px;z-index:5}
.sb .r{display:flex;gap:6px;align-items:center}
.sb .bat{width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px;opacity:.9}
.sb .bat i{display:block;height:100%;width:70%;background:currentColor;border-radius:1.5px}
.hi{position:absolute;bottom:8px;left:50%;width:134px;margin-left:-67px;height:5px;border-radius:3px;background:var(--ink);z-index:9}

.scroll{position:absolute;inset:50px 0 0 0;padding:0 16px 120px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.card{background:var(--surface);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.btn{min-height:48px;border-radius:999px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px/1 "Plus Jakarta Sans";padding:0 20px;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--on-ink)}
.btn.sec{background:var(--surface-3);color:var(--ink)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);flex:none}
.glyph{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in oklab,var(--t) var(--tint),transparent);color:var(--t)}
.glyph.sm{width:28px;height:28px;border-radius:9px}
.glyph.sm svg{width:16px;height:16px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}

/* ---------- home ---------- */
.hhead{display:flex;align-items:flex-end;justify-content:space-between;padding:4px 4px 12px}
.hhead small{display:block;color:var(--ink-3);font-size:15px;font-weight:600}
.hhead h1{font-size:28px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.hero h2{font-size:20px;font-weight:800;letter-spacing:-.01em}
.streak{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 9px;border-radius:999px;font-weight:700;font-size:14px;color:var(--streak);background:color-mix(in oklab,var(--streak) 15%,transparent)}
.goal{display:flex;align-items:flex-end;gap:14px;margin:8px 0 12px}
.goal b{font-size:52px;line-height:.9;font-weight:800;letter-spacing:-.04em}
.goal b span{font-size:26px;color:var(--ink-3);font-weight:700;letter-spacing:-.02em}
.goal p{font-size:15px;line-height:1.3;color:var(--ink-2);padding-bottom:3px}
.goal p strong{color:var(--ink);font-weight:700;display:block;font-size:16px}
.pips{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pips i{height:10px;border-radius:5px;background:var(--surface-3)}
.pips i:first-child{background:transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.week{display:flex;justify-content:space-between;margin:12px 0 14px;padding:8px 10px;border-radius:16px;background:color-mix(in oklab,var(--ink) 4%,transparent)}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink-3);width:32px}
.day span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3)}
.day.done{color:var(--ink-2)}
.day.done span{background:var(--streak);color:#1A0E00}
.day.today{color:var(--ink)}
.day.today span{background:transparent;box-shadow:inset 0 0 0 2px var(--streak);color:var(--streak)}
.hero .btns{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.hero .btns .btn{min-height:52px;padding:0 14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink)}

.cont{margin-top:12px;background:color-mix(in oklab,var(--t) 11%,var(--surface));padding:16px 16px 16px}
.cont .eb{font-size:14px;font-weight:700;color:var(--t)}
.cont h3{font-size:19px;line-height:1.25;font-weight:800;letter-spacing:-.01em;margin:2px 0 2px}
.cont .meta{font-size:15px;color:var(--ink-2)}
.prog{height:6px;border-radius:3px;background:color-mix(in oklab,var(--t) 22%,transparent);overflow:hidden}
.prog i{display:block;height:100%;background:var(--t);border-radius:3px}
.go{width:48px;height:48px;border-radius:50%;background:var(--t);color:var(--paper);display:grid;place-items:center;flex:none}
[data-theme="light"] .go{color:#fff}

.route{margin-top:12px}
.route h3{font-size:17px;font-weight:800}
.link{color:var(--ink);font-weight:700;font-size:15px;min-height:44px;display:inline-flex;align-items:center;gap:4px;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;text-decoration-color:var(--ink-3)}
.big{display:flex;align-items:baseline;gap:8px;margin:0 0 10px}
.big b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.big span{color:var(--ink-2);font-size:15px;font-weight:600}
.ribbon{display:flex;gap:3px;height:14px}
.ribbon i{border-radius:4px;background:color-mix(in oklab,var(--t) 26%,transparent);position:relative;overflow:hidden}
.ribbon i b{position:absolute;inset:0 auto 0 0;background:var(--t);border-radius:4px}
.legend{display:flex;flex-direction:column;gap:2px;margin-top:12px}
.legend .row{min-height:40px;font-size:15px;font-weight:600}
.legend .row .n{margin-left:auto;color:var(--ink-2);font-weight:600}

.secthead{display:flex;justify-content:space-between;align-items:center;margin:22px 4px 8px}
.secthead h3{font-size:20px;font-weight:800;letter-spacing:-.01em}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.tile h4{font-size:15px;line-height:1.25;font-weight:700;margin-top:10px}
.tile .prog{margin-top:8px;height:5px}

/* tab bar */
.tabs{position:absolute;left:12px;right:12px;bottom:26px;height:68px;border-radius:30px;background:var(--bar);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:8;box-shadow:0 10px 30px -10px rgba(0,0,0,.5),0 0 0 1px var(--hairline)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:12px;font-weight:700;border-radius:24px}
.tab.on{color:var(--ink);background:color-mix(in oklab,var(--ink) 9%,transparent)}
.fade{position:absolute;left:0;right:0;bottom:0;height:104px;background:linear-gradient(transparent,var(--paper) 70%);z-index:7;pointer-events:none}

/* ---------- lesson ---------- */
.ltop{position:absolute;top:50px;left:0;right:0;height:60px;padding:0 12px;display:flex;align-items:center;gap:8px;z-index:6;background:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 5px;border-radius:999px;background:color-mix(in oklab,var(--t) var(--tint),transparent);color:var(--t);font-weight:700;font-size:14px}
.chip .glyph.sm{background:var(--t);color:var(--paper);width:26px;height:26px;border-radius:50%}
.readbar{position:absolute;top:110px;left:0;right:0;height:3px;background:var(--hairline);z-index:6}
.readbar i{display:block;height:100%;width:24%;background:var(--t)}
.lscroll{position:absolute;inset:113px 0 0 0;padding:18px 22px 0;overflow:hidden}
.lmeta{font-size:15px;font-weight:600;color:var(--ink-3);display:flex;gap:10px;align-items:center}
.lmeta .d{width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
.lscroll h1{font-size:28px;line-height:1.12;font-weight:800;letter-spacing:-.025em;margin:8px 0 14px}
.lead{font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.55;color:var(--ink)}
.lscroll h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:20px 0 10px}
.serif{font-family:"Newsreader",Georgia,serif;font-size:19px;line-height:1.6;color:var(--ink-2)}
.serif strong{color:var(--ink);font-weight:500}
.fig{background:var(--surface);border-radius:20px;padding:16px 14px 14px;box-shadow:var(--shadow)}
.ladder{display:flex;gap:10px}
.axis{width:22px;display:flex;flex-direction:column;align-items:center;color:var(--ink-3);font-size:11px;font-weight:700}
.axis .ln{flex:1;width:2px;background:linear-gradient(var(--t),color-mix(in oklab,var(--t) 15%,transparent));border-radius:1px;margin:4px 0}
.rungs{flex:1;display:flex;flex-direction:column;gap:6px}
.rung{border-radius:12px;padding:7px 12px 8px;background:color-mix(in oklab,var(--t) calc(var(--lv) * 7%),var(--surface-2));border:1px solid var(--hairline)}
.rung .nm{font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.rung .nm em{font-style:normal;font-size:13px;font-weight:700;color:var(--ink-3)}
.stops{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.stop{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--t);padding:2px 8px 2px 5px;border-radius:7px;background:color-mix(in oklab,var(--t) 16%,transparent)}
.stop.none{color:var(--ink-3);background:transparent;padding-left:0}
.cap{font-size:14px;color:var(--ink-3);margin-top:10px;line-height:1.4}
.dock{position:absolute;left:12px;right:12px;bottom:26px;height:64px;border-radius:30px;background:var(--bar);backdrop-filter:blur(18px);display:flex;align-items:center;gap:6px;padding:0 10px;z-index:8;box-shadow:0 10px 30px -10px rgba(0,0,0,.5),0 0 0 1px var(--hairline)}
.dock .iconbtn{background:transparent;box-shadow:none}
.dock .mid{flex:1;min-width:0}
.dock .mid small{display:block;font-size:12px;font-weight:700;color:var(--ink-3)}
.dock .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .next{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--t);color:var(--paper)}

/* ---------- question ---------- */
.qtop{position:absolute;top:50px;left:0;right:0;height:56px;padding:0 16px 0 10px;display:flex;align-items:center;gap:10px}
.qtop .iconbtn{background:transparent;box-shadow:none}
.segs{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.segs i{height:6px;border-radius:3px;background:var(--surface-3)}
.segs i.ok{background:var(--correct)} .segs i.no{background:var(--wrong)}
.qtop .cnt{font-weight:700;font-size:15px;color:var(--ink-2);min-width:42px;text-align:right}
.qbody{position:absolute;inset:106px 0 0 0;padding:6px 16px 0}
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kind{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;background:var(--surface);font-size:14px;font-weight:700;color:var(--ink-2);box-shadow:var(--shadow)}
.qbody h1{font-size:20px;line-height:1.3;font-weight:700;letter-spacing:-.01em;margin:10px 2px 14px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:var(--surface);font-size:16px;line-height:1.35;font-weight:500;min-height:56px;position:relative}
.box{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;margin-top:1px}
.opt .tag{position:absolute;top:-10px;right:12px;display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:800;background:var(--paper)}
.opt.hit{background:color-mix(in oklab,var(--correct) 15%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--correct) 60%,transparent)}
.opt.hit .box{background:var(--correct);color:#04140B}
.opt.hit .tag{color:var(--correct)}
.opt.miss{background:var(--surface);box-shadow:none;outline:2px dashed color-mix(in oklab,var(--correct) 75%,transparent);outline-offset:-2px}
.opt.miss .box{box-shadow:inset 0 0 0 2px var(--correct)}
.opt.miss .tag{color:var(--correct)}
.opt.bad{background:color-mix(in oklab,var(--wrong) 15%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--wrong) 60%,transparent)}
.opt.bad .box{background:var(--wrong);color:#1A0306}
.opt.bad .tag{color:var(--wrong)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface-2);border-radius:28px 28px 0 0;padding:16px 18px 36px;z-index:6;box-shadow:0 -18px 40px -10px rgba(0,0,0,.55),0 -1px 0 var(--hairline)}
.handle{width:36px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 12px}
.verdict{display:flex;align-items:center;gap:12px}
.verdict .vi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--wrong) 18%,transparent);color:var(--wrong)}
.verdict h2{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.verdict p{font-size:14px;font-weight:700;color:var(--ink-3)}
.tally{display:flex;gap:6px;margin:12px 0 10px}
.tally span{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-3);color:var(--ink-2)}
.tally .c{color:var(--correct)} .tally .w{color:var(--wrong)}
.explain{font-size:16px;line-height:1.5;color:var(--ink-2)}
.explain strong{color:var(--ink)}
.topic{display:flex;align-items:center;gap:10px;min-height:52px;margin:10px 0 12px;padding:0 6px 0 8px;border-radius:16px;background:color-mix(in oklab,var(--t) 10%,transparent)}
.topic .t{flex:1;font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.3}
.topic .t b{color:var(--ink);font-weight:700;display:block;font-size:15px}
.topic .lm{font-weight:800;font-size:15px;color:var(--t);display:flex;align-items:center;gap:2px;min-height:44px;padding:0 6px}
.sheet .btn{width:100%;min-height:56px;font-size:17px}
</style>
</head>
